# PR と main への push のたびに、Go のテストと検査を動かす（段階1の最小の CI）。
# セキュリティの検査は、段階2で足す。
name: ci

on:
  pull_request:
  push:
    branches: [main]

# このワークフローには、コードを読む権限だけを与える
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 外部の部品は、コミット ID で指定する（CLAUDE.md）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
